<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" overflow="visible">
  <defs>
    <filter id="soft" x="-50%" y="-20%" width="200%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.035" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="16"/>
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <style>
    .w { fill: none; stroke: #A8A397; stroke-linecap: round; transform-box: fill-box; animation: rise 14s ease-in-out infinite; }
    .w2 { animation-delay: -5s; animation-duration: 17s; }
    .w3 { animation-delay: -10s; animation-duration: 20s; }
    @keyframes rise {
      0%   { opacity: 0;   transform: translate(0, 40px) scaleX(.9); }
      25%  { opacity: .7; }
      70%  { opacity: .45; }
      100% { opacity: 0;   transform: translate(14px, -70px) scaleX(1.15); }
    }
    @media (prefers-reduced-motion: reduce) { .w { animation: none; opacity: .3; } }
  </style>
  <g filter="url(#soft)">
    <path class="w"    stroke-width="34" d="M200 500 C150 440 250 400 200 340 C150 280 245 240 205 175 C175 125 225 85 210 30"/>
    <path class="w w2" stroke-width="24" d="M150 510 C115 455 190 415 160 360 C130 305 195 270 170 210 C150 165 185 125 175 80"/>
    <path class="w w3" stroke-width="20" d="M255 505 C290 450 230 410 262 355 C292 300 240 262 268 205 C288 160 255 120 266 70"/>
  </g>
</svg>
